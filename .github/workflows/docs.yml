name: Deploy Documentation (GitHub Pages fallback)

# Primary rascommander.info hosting remains independently administered.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated main revision to the fallback Pages site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs-validate.yml
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the validated artifact (no checkout or package installation)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
